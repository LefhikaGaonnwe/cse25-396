<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Feedback</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Combined CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg shadow-sm">
  <div class="container">
    
    <a class="navbar-brand fw-bold" href="index.html">
      <i class="bi bi-heart-pulse-fill text-primary"></i>
      Feedback
    </a>

    <button class="navbar-toggler" type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navMenu">

      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">

      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="purchase.html">Purchase</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="history.html">History</a>
        </li>

        <li class="nav-item">
          <a class="nav-link active" href="feedback.html">Feedback</a>
        </li>
      </ul>

    </div>
  </div>
</nav>

<!-- FEEDBACK SECTION -->
<section class="feedback-section py-5">

  <div class="container">

    <div class="feedback-container mx-auto">

      <h2 class="text-center feedback-title mb-4">
        We Value Your Feedback
      </h2>

      <!-- FORM -->
      <form>

        <div class="mb-3">
          <input type="text"
            class="form-control"
            placeholder="Your Name">
        </div>

        <div class="mb-3">
          <input type="email"
            class="form-control"
            placeholder="Your Email">
        </div>

        <div class="mb-4">
          <textarea
            class="form-control"
            rows="5"
            placeholder="Your Message"></textarea>
        </div>

        <!-- STAR RATING -->
        <div class="mb-4">
          <h5 class="rating-title">
            Rate Your Experience
          </h5>

          <div class="stars">
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
          </div>
        </div>

        <!-- BUTTON -->
        <div class="text-center">
          <button type="submit"
            class="btn btn-primary submit-btn">
            Submit
          </button>
        </div>

      </form>

    </div>

  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
