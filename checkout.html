<!-- CHECKOUT SECTION -->
<section class="checkout-section py-5">

  <div class="container">

    <div class="checkout-container">

      <h2 class="checkout-title mb-4 text-center">
        Checkout Summary
      </h2>

      <!-- TABLE -->
      <div class="table-responsive">

        <table class="table checkout-table align-middle">

          <thead>
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Total</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="checkout-items">

          </tbody>

        </table>

      </div>

      <!-- TOTAL -->
      <div class="checkout-summary text-end mt-4">

        <h4>
          Grand Total: <span id="grand-total">$0.00</span>
        </h4>

      </div>

      <!-- BUTTONS -->
      <div class="d-flex justify-content-between flex-wrap gap-3 mt-4">

        <a href="purchase.html"
          class="btn btn-outline-primary add-more-btn">
          Add More Products
        </a>

        <button class="btn btn-primary confirm-btn"
          id="confirm-order-btn">
          Confirm Order
        </button>

      </div>

      <!-- SUCCESS MESSAGE -->
      <div class="alert alert-success mt-4 d-none"
        id="success-message">

        Your order has been sent successfully to the business.

      </div>

    </div>

  </div>

</section>
