</head>

      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navMenu">

      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">

    <ul class="navbar-nav ms-auto">
        <li class="nav-item">

<!-- CONTACT SECTION -->
<section class="contact-section py-5">

  <div class="container">

    <div class="contact-container">

      <!-- TOP SECTION -->
      <div class="row g-4 align-items-center">

        <!-- CONTACT INFO -->
        <div class="col-lg-5">

          <h2 class="contact-title mb-4">
            Get in Touch with Us
          </h2>

          <div class="contact-info">

            <div class="contact-item">
              <i class="bi bi-telephone-fill"></i>
              <span><strong>Phone:</strong> (123) 456-7890</span>
            </div>

            <div class="contact-item">
              <i class="bi bi-envelope-fill"></i>
              <span><strong>Email:</strong> info@company.com</span>
            </div>

            <div class="contact-item">
              <i class="bi bi-geo-alt-fill"></i>
              <span><strong>Location</strong></span>
            </div>

          </div>

        </div>

        <!-- MAP -->
        <div class="col-lg-7">

          <div class="map-container">

            <img
              src="https://maps.gstatic.com/tactile/basepage/pegman_sherlock.png"
              alt="Map"
              class="img-fluid w-100">

          </div>

        </div>

      </div>

      <hr class="my-5">

      <!-- CONTACT FORM -->
      <div class="message-section">

        <h3 class="message-title mb-4">
          Send Us a Message
        </h3>

        <form>

          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              placeholder="Your Name">
          </div>

          <div class="mb-4">
            <textarea
              class="form-control"
              rows="5"
              placeholder="Your Message"></textarea>
          </div>

          <div class="text-center">
            <button
              type="submit"
              class="btn btn-primary contact-btn">
              Send Message
            </button>
          </div>

        </form>

      </div>

    </div>

  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
