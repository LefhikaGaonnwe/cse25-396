</head>
<body>

<header>

    <nav class="navbar navbar-expand-lg shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">LOGO</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>

<!-- PAGE CONTENT -->
<div class="container py-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold">Purchase</h4>

    <div class="d-flex gap-2">
      <input type="text" class="form-control search-box" placeholder="Search Product History">
      <button class="btn btn-primary">Filter</button>
    </div>
  </div>

  <!-- FILTER OPTIONS -->
  <div class="filter-box p-3 mb-3">
    <div class="d-flex gap-4">
      <div>
        <input type="radio" name="filter" checked> Category
      </div>
      <div>
        <input type="radio" name="filter"> Price
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-responsive">
    <table class="table custom-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Product</th>
          <th>Service</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>01/15/2022</td>
          <td>Heart Monitor</td>
          <td>Installation</td>
          <td class="status completed">Completed</td>
        </tr>

        <tr>
          <td>01/15/2022</td>
          <td>Patient Monitor</td>
          <td>Installation</td>
          <td class="status completed">Completed</td>
        </tr>

        <tr>
          <td>01/15/2022</td>
          <td>Mobility Walker</td>
          <td>Installation</td>
          <td class="status completed">Completed</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
